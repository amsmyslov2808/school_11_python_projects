<html>
    <head>
        <meta charset="utf-8">
        <title>Мой сайт</title>

        <style>
            /* Стиль применяется ко всем элементам с классом red-div. */
            .red-div{
                background-color: red;
            }
        </style>
    </head>
    <body>
        <div class="red-div">
            инфа 1
        </div>
        <div id="print-div">
            инфа 2
        </div>
        <div>
            инфа 3
        </div>

        <script>
            // Находим элемент по уникальному id и дописываем текст к его содержимому.
            let print_div = document.getElementById("print-div");
            print_div.innerText += "AAAAAAA";
        </script>
    </body>
</html>
